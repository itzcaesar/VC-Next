[package]
name = "voice-changer-next"
version = "0.1.0"
description = "A Windows-first, low-latency RVC desktop client"
authors = ["VC Next contributors"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "voice_changer_next_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.18"
crossbeam-queue = "0.3"

[target.'cfg(target_os = "windows")'.dependencies]
# CPAL 0.18 currently permits windows-core 0.61-0.62 independently of its
# windows crate. Keep both on Tauri's 0.61 line to avoid duplicate COM traits.
windows-core = "=0.61.2"
